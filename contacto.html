<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto — Apadrina</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="Imagenes/Banners/favicon.png" type="image/png">
</head>
<body>

<div id="header-placeholder"></div>

<div class="container">
  <h2 class="section-title" style="text-align:center;">Hablemos</h2>
  <p class="section-sub" style="text-align:center;">¿Eres un refugio, un padrino con dudas, o quieres saber más? Escríbenos.</p>

  <div class="form-box">
    <label for="tipo">¿Quién eres?</label>
    <select id="tipo" style="width:100%;padding:12px 14px;border:1px solid var(--borde);border-radius:10px;font-size:15px;">
      <option>Soy un refugio y quiero sumarme</option>
      <option>Soy padrino y tengo una duda</option>
      <option>Otro</option>
    </select>

    <label for="nombre">Nombre completo</label>
    <input type="text" id="nombre" placeholder="Tu nombre">

    <label for="email">Correo electrónico</label>
    <input type="email" id="email" placeholder="tucorreo@ejemplo.com">

    <label for="mensaje">Mensaje</label>
    <input type="text" id="mensaje" placeholder="Cuéntanos en qué te ayudamos">

    <button class="btn btn-primary" style="width:100%; margin-top:20px;">Enviar mensaje</button>
    <p style="font-size:12px; color:var(--gris); text-align:center; margin-top:12px;">Te respondemos dentro de 48 horas hábiles.</p>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="main.js"></script>
</body>
</html>
