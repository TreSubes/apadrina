<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Apadrina</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="Imagenes/Banners/favicon.png" type="image/png">
</head>
<body>

<div id="header-placeholder"></div>

<div class="container">
  <div class="dog-hero">
    <div class="dog-photo" id="foto-animal"></div>
    <div class="dog-hero-info">
      <span class="badge" id="badge-refugio"></span>
      <h1 style="margin:0 0 8px;" id="nombre-animal"></h1>
      <p style="color:var(--gris); margin-top:0;" id="descripcion-animal"></p>

      <div class="stat-box">
        <div class="stat"><b id="stat-gasto"></b><span>gasto mensual aprox.</span></div>
        <div class="stat"><b id="stat-padrinos"></b><span>padrinos activos</span></div>
        <div class="stat"><b id="stat-meses"></b><span>meses en el refugio</span></div>
      </div>

      <p class="texto-aporte-box" id="texto-aporte"></p>
    </div>
  </div>
</div>

<div class="container" id="niveles">
  <h2 class="section-title" id="titulo-nombre-animal">Elige tu nivel de apadrinamiento</h2>
  <p class="section-sub">Todos los niveles incluyen updates semanales por chat. Cancela cuando quieras.</p>

  <div class="tiers" id="tiers-container">
    <!-- Los niveles se generan dinámicamente para incluir el nombre del animal en cada link -->
  </div>
</div>

<div class="container otros-peludos-section" id="otros-peludos-section">
  <h2 class="section-title" style="text-align:center;">Conoce otros peludos</h2>
  <p class="section-sub" style="text-align:center;">También están esperando un padrino en refugios de la RM.</p>

  <div class="grid" id="grid-otros-peludos">
    <!-- Se genera dinámicamente desde animales.js, excluyendo al peludo actual -->
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="animales.js"></script>
<script src="main.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const idAnimal = params.get('id') || 'rocky';
    const animal = (typeof animalesDB !== 'undefined') ? animalesDB[idAnimal] : null;

    if (!animal) {
      document.getElementById('nombre-animal').textContent = 'No encontramos a este peludo';
      document.getElementById('descripcion-animal').textContent = 'Puede que el link esté mal escrito. Vuelve al inicio para ver los peludos disponibles.';
      return;
    }

    document.getElementById('page-title').textContent = animal.nombre + ' — Apadrina';
    document.getElementById('badge-refugio').textContent = `${animal.refugio} · ${animal.comuna}, RM`;
    document.getElementById('nombre-animal').textContent = animal.nombre;
    document.getElementById('descripcion-animal').textContent = animal.descripcion;
    document.getElementById('titulo-nombre-animal').textContent = `Elige tu nivel de apadrinamiento para ${animal.nombre}`;

    document.getElementById('stat-gasto').textContent = '$' + animal.gastoMensual.toLocaleString('es-CL');
    document.getElementById('stat-padrinos').textContent = animal.padrinosActivos;
    document.getElementById('stat-meses').textContent = animal.mesesEnRefugio;

    document.getElementById('texto-aporte').textContent =
      `Tu aporte mensual ayuda directamente a la comida, vacunas y cuidado veterinario de ${animal.nombre}, y te conecta semana a semana con su historia.`;

    const fotoEl = document.getElementById('foto-animal');
    const fotoPrincipal = (animal.imagenes && animal.imagenes[0]) ? `Imagenes/Mascotas/${animal.imagenes[0]}` : '';
    if (fotoPrincipal) {
      fotoEl.style.backgroundImage = `url('${fotoPrincipal}')`;
    } else {
      fotoEl.style.backgroundColor = animal.colorPlaceholder || '#D9B38C';
    }

    const niveles = [
      { key: 'amigo', emoji: '🐾', nombre: 'Amigo', precio: 5000, destacado: false,
        items: [`1 foto semanal de ${animal.nombre}`, 'Certificado digital de apadrinamiento', 'Acceso al chat con el equipo de Apadrina'] },
      { key: 'companero', emoji: '💛', nombre: 'Compañero', precio: 12000, destacado: true,
        items: ['Fotos y videos semanales', 'Mensajes personalizados sobre su día a día', `Certificado + nombre en el perfil de ${animal.nombre}`, 'Novedades sobre su salud y avances'] },
      { key: 'familia', emoji: '🏡', nombre: 'Familia Apadrina', precio: 20000, destacado: false,
        items: ['Todo lo del plan Compañero', 'Videollamada trimestral (sujeta a disponibilidad del refugio)', 'Prioridad si decides adoptarlo', 'Invitación a visitas presenciales'] },
    ];

    const tiersContainer = document.getElementById('tiers-container');
    tiersContainer.innerHTML = niveles.map((nivel) => `
      <div class="tier ${nivel.destacado ? 'selected' : ''}" onclick="location.href='checkout.html?perro=${encodeURIComponent(animal.nombre)}&id=${animal.id}&tier=${nivel.key}'">
        <h4>${nivel.emoji} ${nivel.nombre}</h4>
        <div class="price">$${nivel.precio.toLocaleString('es-CL')} <span>/ mes</span></div>
        <div class="tier-beneficios-label">Beneficios exclusivos</div>
        <ul class="lista-beneficios">
          ${nivel.items.map((item) => `<li>${item}</li>`).join('')}
        </ul>
        <button class="btn ${nivel.destacado ? 'btn-primary' : 'btn-secondary'}" style="width:100%;">Elegir${nivel.destacado ? ' (más popular)' : ''}</button>
      </div>
    `).join('');

    // Sección "Conoce otros peludos": otros animales, excluyendo el actual
    const gridOtros = document.getElementById('grid-otros-peludos');
    if (gridOtros) {
      const otros = Object.values(animalesDB).filter((a) => a.id !== animal.id).slice(0, 4);

      if (otros.length === 0) {
        document.getElementById('otros-peludos-section').style.display = 'none';
      } else {
        gridOtros.innerHTML = otros.map((otro) => {
          const fotoPrincipal = (otro.imagenes && otro.imagenes[0]) ? `Imagenes/Mascotas/${otro.imagenes[0]}` : '';
          const fondoImagen = fotoPrincipal
            ? `background-image:url('${fotoPrincipal}');`
            : `background-color:${otro.colorPlaceholder || '#D9B38C'};`;

          return `
            <a href="perfil-perro.html?id=${otro.id}" class="card">
              <div class="card-img" style="${fondoImagen}"></div>
              <div class="card-body">
                <h3>${otro.nombre}</h3>
                <div class="meta">${otro.edad} · ${otro.refugio}, ${otro.comuna}</div>
              </div>
            </a>
          `;
        }).join('');
      }
    }
  });
</script>
</body>
</html>
